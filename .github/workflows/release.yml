name: Release

# Every push is built and tested. Only pushes to main publish a release and the browser version.
on:
  push:
    branches: [main, 'claude/**']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Windows scripts must be ASCII-only
        run: |
          if LC_ALL=C grep -nP '[^\x00-\x7F]' server.ps1 install.ps1 Start-FocusQuest.cmd Install-FocusQuest.cmd; then
            echo "Non-ASCII bytes found (Windows PowerShell 5.1 would misread them)"; exit 1
          fi

      - name: Build app.html and the browser version
        run: node dev/build.js --web

      - name: Browser tests
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          node dev/run-tests.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Assemble zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/FocusQuest
          cp app.html dist/FocusQuest/
          # Files for Windows get CRLF line endings whatever the checkout produced.
          for f in server.ps1 install.ps1 Start-FocusQuest.cmd Install-FocusQuest.cmd README.txt; do
            sed 's/\r$//; s/$/\r/' "$f" > "dist/FocusQuest/$f"
          done
          sed 's/\r$//; s/$/\r/' LICENSE > dist/FocusQuest/LICENSE.txt
          printf '%s\r\n' "$VERSION" > dist/FocusQuest/version.txt
          cd dist
          zip -r -X "FocusQuest-$VERSION.zip" FocusQuest
          sha256sum "FocusQuest-$VERSION.zip" > "FocusQuest-$VERSION.zip.sha256"
          rm -r FocusQuest

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/
          if-no-files-found: error

  # Runs the installer from the zip on Windows PowerShell 5.1 (shell: powershell, not pwsh).
  installer-test:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist

      # Company PCs often set the execution policy RemoteSigned by group policy. It overrides the
      # "-ExecutionPolicy Bypass" of the launchers: scripts marked as downloaded do not run.
      - name: Set the machine policy RemoteSigned
        run: |
          $ErrorActionPreference = 'Stop'
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell'
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name EnableScripts -Value 1 -Type DWord
          Set-ItemProperty -Path $key -Name ExecutionPolicy -Value 'RemoteSigned' -Type String
          $p = & powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Get-ExecutionPolicy"
          if ($p -ne 'RemoteSigned') { throw "policy is $p" }

      - name: Zip not unblocked - installer does not run and says what to do
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = (Get-ChildItem dist\*.zip)[0].FullName
          Expand-Archive -LiteralPath $zip -DestinationPath extracted
          $src = Join-Path (Resolve-Path extracted) 'FocusQuest'
          # Explorer copies the "downloaded" mark of a zip file to every file it extracts.
          Get-ChildItem -LiteralPath $src -File | ForEach-Object { Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" }
          $t = Join-Path $env:RUNNER_TEMP 'fq-blocked'
          $out = (cmd /c "$src\Install-FocusQuest.cmd -TargetDir $t -NoShortcut -NoStart < nul 2>&1") | Out-String
          Write-Host $out
          if (Test-Path -LiteralPath (Join-Path $t 'app.html')) { throw 'blocked installer installed anyway' }
          if ($out -notmatch 'not digitally signed') { throw 'expected the signing error' }
          if ($out -notmatch 'Unblock') { throw 'hint about unblocking is missing' }
          # Unblocking the zip file before extracting leaves no mark on the files.
          Get-ChildItem -LiteralPath $src -File | Unblock-File

      - name: Install from the unblocked zip
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path (Resolve-Path extracted) 'FocusQuest'
          $target = Join-Path $env:LOCALAPPDATA 'FocusQuest'

          $out = (cmd /c "$src\Install-FocusQuest.cmd -NoStart < nul 2>&1") | Out-String
          Write-Host $out
          if ($out -notmatch 'FocusQuest is installed in') { throw 'installer did not finish' }

          foreach ($f in 'app.html','server.ps1','Start-FocusQuest.cmd','README.txt','LICENSE.txt','version.txt') {
            if (-not (Test-Path -LiteralPath (Join-Path $target $f))) { throw "$f was not installed" }
          }
          if (Test-Path -LiteralPath (Join-Path $target 'install.ps1')) { throw 'installer copied itself' }

          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'FocusQuest.lnk'
          if (-not (Test-Path -LiteralPath $lnk)) { throw 'Start menu entry missing' }
          $boot = Join-Path ([Environment]::GetFolderPath('Startup')) 'FocusQuest.lnk'
          if (-not (Test-Path -LiteralPath $boot)) { throw 'Startup shortcut missing' }
          $sc = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          if ($sc.TargetPath -ne (Join-Path $target 'Start-FocusQuest.cmd')) { throw "shortcut points to $($sc.TargetPath)" }
          Write-Host "Shortcut OK -> $($sc.TargetPath)"

      - name: Reinstall keeps the data folder
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path (Resolve-Path extracted) 'FocusQuest'
          $target = Join-Path $env:LOCALAPPDATA 'FocusQuest'
          New-Item -ItemType Directory -Path "$target\data" -Force | Out-Null
          Set-Content -LiteralPath "$target\data\focusquest-data.json" -Value '{"keep":"me"}'
          Set-Content -LiteralPath "$target\app.html" -Value 'old'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$src\install.ps1" -NoStart
          if ($LASTEXITCODE -ne 0) { throw "installer exited with $LASTEXITCODE" }
          if ((Get-Content -Raw "$target\data\focusquest-data.json") -notmatch 'keep') { throw 'data was touched' }
          if ((Get-Item "$target\app.html").Length -lt 1000) { throw 'app.html was not replaced' }

      - name: Installed helper starts and serves the app
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:LOCALAPPDATA 'FocusQuest'
          $p = Start-Process powershell.exe -PassThru -WindowStyle Hidden -ArgumentList @(
            '-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',"`"$target\server.ps1`"",'-NoBrowser','-Port','8791') `
            -RedirectStandardOutput helper.out -RedirectStandardError helper.err
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri 'http://localhost:8791/api/ping' -TimeoutSec 3
              if ($r.Content -match 'focusquest') { $ok = $true }
            } catch { }
          }
          if (-not $ok) {
            Get-Content helper.out, helper.err -ErrorAction SilentlyContinue
            if (-not $p.HasExited) { $p.Kill() }
            throw 'helper did not answer on /api/ping'
          }
          $page = Invoke-WebRequest -UseBasicParsing -Uri 'http://localhost:8791/' -TimeoutSec 10
          if ($page.Content -notmatch 'FocusQuest') { throw 'page not served' }
          if ($page.Content -match '__FQ_TOKEN__') { throw 'secret placeholder was not replaced' }
          $p.Kill()
          Write-Host 'Helper OK'

      # Routes, update check and update install of the installed helper, against a local stand-in for GitHub.
      - name: Helper routes and in-app update
        run: |
          $target = Join-Path $env:LOCALAPPDATA 'FocusQuest'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File dev\test-helper.ps1 -Install $target
          if ($LASTEXITCODE -ne 0) { throw 'helper tests failed' }

  # Publishes the browser version. Skipped until GitHub Pages is switched on
  # (repository Settings > Pages > Source: GitHub Actions).
  pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Is GitHub Pages switched on?
        id: enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" > /dev/null 2>&1; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages is not switched on, the browser version was not published."
          fi
      - uses: actions/deploy-pages@v4
        id: deploy
        if: steps.enabled.outputs.on == 'true'

  release:
    needs: [build, installer-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist

      # The part above the marker is what the app shows as "what's new" before an update.
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          prev=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev" > /dev/null; then range="$prev..HEAD"; else range="-5"; fi
          {
            echo "## What's new"
            # commits that only concern tests, the workflow or the docs are left out (subject starts with test:, ci:, chore:, docs: or build:)
            git log --no-merges --format='- %s' $range | grep -viE '^- (test|ci|chore|docs|build)(\([^)]*\))?:' > "$RUNNER_TEMP/new.txt" || true
            if [ -s "$RUNNER_TEMP/new.txt" ]; then cat "$RUNNER_TEMP/new.txt"; else echo '- Small fixes and maintenance'; fi
            echo
            echo '<!-- install -->'
            echo '## Update'
            echo 'In FocusQuest, click "Version '"$VERSION"' is available" at the bottom left, then "Install update". Your data is kept.'
            echo
            echo 'If your copy is older than the in-app update, update by hand once: close the helper window and follow the install steps with the new zip file.'
            echo
            echo '## Install'
            echo "1. Download \`FocusQuest-$VERSION.zip\`."
            echo '2. Right-click the zip file, choose Properties, tick "Unblock" ("Zulassen") and click OK.'
            echo '3. Extract it and double-click `Install-FocusQuest.cmd`. No admin rights needed.'
            echo
            echo 'If the PC only runs signed PowerShell scripts even after unblocking, double-click `app.html` from the zip (to-dos only, no Jira).'
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FocusQuest $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

  # After the release: the release before this one updates itself to it through the real GitHub.
  # Informational only, the release is already published at this point.
  live-update:
    needs: [build, release]
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Previous release updates itself to this one
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tags = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=5" --jq '.[].tag_name'
          $prev = @($tags | Where-Object { $_ -ne "v$env:VERSION" })[0]
          if (-not $prev) { Write-Host 'There is no earlier release.'; exit 0 }
          gh release download $prev --repo $env:GITHUB_REPOSITORY --pattern '*.zip' --dir prev
          Expand-Archive -LiteralPath (Get-ChildItem prev\*.zip)[0].FullName -DestinationPath prev\x
          $dir = (Resolve-Path prev\x\FocusQuest).Path
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File dev\test-live-update.ps1 -Dir $dir -Expect $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw 'The live update failed.' }
